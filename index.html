<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080b10">
  <meta name="description" content="金と銀で戦う4×4×4の立体四目ならべ">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="public/icons/cube-four.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="public/icons/cube-four.svg">
  <link rel="manifest" href="manifest.webmanifest?v=feature-suite-1">
  <title>キューブならべ！</title>
  <link rel="stylesheet" href="styles.css?v=gold-silver-1">
  <link rel="stylesheet" href="online.css?v=gold-silver-1">
</head>
<body>
  <main class="app">
    <header>
      <button id="homeBtn" class="icon-btn" aria-label="メニュー">⌂</button>
      <h1>CUBE FOUR<small>4 × 4 × 4</small></h1>
      <button id="soundBtn" class="icon-btn" aria-label="BGMと効果音">🔊</button>
    </header>

    <section id="game" class="game" aria-label="立体四目ならべ盤面">
      <div class="status-card">
        <span id="turnPiece" class="mini-piece dark"></span>
        <strong id="statusText">ゴールド の ばん</strong>
        <span id="thinking" hidden>かんがえ中…</span>
        <time id="clockDisplay" hidden>0:30</time>
      </div>
      <div class="canvas-wrap">
        <canvas id="board" aria-label="4かける4かける4のゲーム盤"></canvas>
        <div class="canvas-tip">光る場所をタップ！ ・ スワイプで回転</div>
      </div>
      <nav class="game-actions">
        <button id="undoBtn">↶<span><ruby>待<rt>ま</rt></ruby>った</span></button>
        <button id="resetViewBtn">◎<span><ruby>正面<rt>しょうめん</rt></ruby></span></button>
        <button id="transparentBtn">◉<span>すける</span></button>
        <button id="newBtn">↻<span>もう一局</span></button>
      </nav>
      <aside id="replayBar" class="replay-bar" hidden aria-label="棋譜再生">
        <button id="replayPrevBtn" aria-label="一手戻る">◀</button>
        <span id="replayCount">0 / 0</span>
        <button id="replayNextBtn" aria-label="一手進む">▶</button>
        <button id="replayExitBtn">終了</button>
      </aside>
    </section>
  </main>

  <dialog id="menuDialog" class="modal">
    <form method="dialog" class="panel">
      <div class="mascot" aria-hidden="true">● ● ● ●</div>
      <h2>CUBE FOUR</h2>
      <p>64の空間を読み、先に4つをつなぐ。</p>
      <fieldset>
        <legend>だれと あそぶ？</legend>
        <label><input type="radio" name="mode" value="cpu" checked><span>CPU<b>コンピュータ</b></span></label>
        <label><input type="radio" name="mode" value="local"><span>2P<b>この端末で</b></span></label>
        <label><input type="radio" name="mode" value="online"><span>LINK<b>2台で対戦</b></span></label>
      </fieldset>
      <fieldset class="clock-options">
        <legend>一手の持ち時間</legend>
        <label><input type="radio" name="clock" value="0" checked><span>∞<b>制限なし</b></span></label>
        <label><input type="radio" name="clock" value="30"><span>30<b>秒</b></span></label>
        <label><input type="radio" name="clock" value="60"><span>60<b>秒</b></span></label>
      </fieldset>
      <div id="cpuOptions">
        <fieldset>
          <legend>つよさ</legend>
          <label><input type="radio" name="difficulty" value="easy"><span>I<b>やさしい</b></span></label>
          <label><input type="radio" name="difficulty" value="normal" checked><span>II<b>ふつう</b></span></label>
          <label><input type="radio" name="difficulty" value="hard"><span>III<b>つよい</b></span></label>
        </fieldset>
        <fieldset>
          <legend>どっちで あそぶ？</legend>
          <label><input type="radio" name="side" value="1" checked><span><i class="mini-piece dark"></i><b>せんて</b></span></label>
          <label><input type="radio" name="side" value="2"><span><i class="mini-piece light"></i><b>あとて</b></span></label>
        </fieldset>
      </div>
      <div id="onlineOptions" hidden>
        <p class="online-lead">対戦コードで接続</p>
        <button id="createRoomBtn" class="room-btn" type="button">部屋を作成</button>
        <div class="join-row">
          <input id="roomCodeInput" maxlength="6" autocomplete="off" placeholder="合言葉 6文字" aria-label="合言葉">
          <button id="joinRoomBtn" class="room-btn" type="button">入る</button>
        </div>
        <div id="roomStatus" class="room-status" aria-live="polite"></div>
        <div id="inviteCard" class="invite-card" hidden>
          <img id="roomQr" alt="対戦ルーム参加用QRコード">
          <button id="shareRoomBtn" class="share-btn" type="button">📤 相手に送る</button>
        </div>
      </div>
      <button id="startBtn" class="primary" value="start">対局を始める</button>
      <button id="tutorialBtn" class="text-btn" type="button">？ あそびかた</button>
      <button id="installBtn" class="text-btn" type="button" hidden>＋ ホーム画面に追加</button>
      <section class="stats-card" aria-label="戦績">
        <span><b id="statPlayed">0</b>対局</span>
        <span><b id="statWins">0</b>勝</span>
        <span><b id="statBest">0</b>最高連勝</span>
      </section>
    </form>
  </dialog>

  <dialog id="resultDialog" class="modal">
    <form method="dialog" class="panel result-panel">
      <div id="resultEmoji" class="result-emoji">🎉</div>
      <h2 id="resultTitle">やったね！</h2>
      <p id="resultText"></p>
      <button id="replayBtn" class="secondary" type="button">棋譜を見る</button>
      <button id="againBtn" class="primary" value="again">もう一局 ↻</button>
      <button id="resultMenuBtn" class="text-btn" value="menu">メニューへ</button>
    </form>
  </dialog>

  <dialog id="tutorialDialog" class="modal">
    <form method="dialog" class="panel tutorial-panel">
      <button class="close" value="close" aria-label="閉じる">×</button>
      <h2>あそびかた</h2>
      <div class="tutorial-art"><span>👇</span><div>●<br>│<br>│</div><b>→</b><div>●<br>●<br>│</div></div>
      <p>すきな <b>棒</b>を タップ。<br>ボールが コトン！</p>
      <div class="four">●―●―●―●</div>
      <p>どの<ruby>方向<rt>ほうこう</rt></ruby>でも<br><b>4つ ならべたら かち！</b></p>
      <button class="primary" value="close">わかった！</button>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script type="importmap">
    {"imports":{"three":"./vendor/three.module.min.js"}}
  </script>
  <script type="module" src="src/main.js?v=feature-suite-1"></script>
</body>
</html>
